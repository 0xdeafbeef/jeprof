[package]
name = "jeprofl"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
aya = "0.13.1"
aya-log = "0.2.1"
clap = { version = "4.1", features = ["derive"] }
jeprofl-common = { path = "../jeprofl-common", features = ["user"] }
anyhow = "1"
env_logger = "0.11.5"
libc = "0.2"
log = "0.4"
tokio = { version = "1.25", features = ["macros", "rt", "rt-multi-thread", "net", "signal", "time"] }
blazesym = "0.2.0-rc.1"
rustc-hash = "2.0.0"
derive_more = { version = "2.0.1", features = ["full"] }
minus = { version = "5.6.1", features = ["dynamic_output"] }
insta = "1.40.0"
crossterm = "0.29.0"
scopeguard = "1.2.0"
csv = "1.3.0"
inferno = "0.12.3"
object = "0.36"
rustc-demangle = "0.1"
regex = "1.10"
jiff = "0.2.15"

[[bin]]
name = "jeprofl"
path = "src/main.rs"
